[package]
name = "sigmaos-rebuild-order"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "SigmaOS rebuild-order component — Arch package rebuild order from pacman syncdbs (archlinux/arch-rebuild-order inspired)"

[lib]
name = "sigmaos_rebuild_order"
path = "src/lib.rs"

[[bin]]
name = "sigmaos-rebuild-order"
path = "src/main.rs"

[dependencies]
thiserror = "1"
tar = "0.4"
zstd = "0.13"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
